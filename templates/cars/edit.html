{% extends 'common/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit {{ car }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1>Edit Car: {{ car }}</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% crispy form %}
        </form>
        <a href="{% url 'cars:detail' slug=car.slug %}" class="btn btn-secondary mt-3">Cancel</a>
    </div>
</div>
{% endblock %}
